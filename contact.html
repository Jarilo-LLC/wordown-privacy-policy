<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Jarilo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 2px solid #1a1a1a;
      padding: 2rem 1.25rem 0;
    }

    header .top {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header .tagline {
      font-size: 0.9rem;
      color: #555;
    }

    nav {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 0;
    }

    nav a {
      display: inline-block;
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #555;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }

    nav a:hover,
    nav a.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
      flex: 1;
      width: 100%;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
    }

    /* --- Contact form --- */
    .contact-form {
      max-width: 560px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #555;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #ccc;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.95rem;
      color: #1a1a1a;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #1a1a1a;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 130px;
    }

    .submit-btn {
      display: inline-block;
      padding: 0.65rem 1.75rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover {
      background: #333;
    }

    .submit-btn:disabled {
      background: #888;
      cursor: default;
    }

    .form-status {
      max-width: 560px;
      margin-bottom: 1.5rem;
      padding: 0.85rem 1.1rem;
      border: 1.5px solid #1a1a1a;
      border-radius: 3px;
      font-size: 0.9rem;
    }

    /* Library shows these by adding data-fs-active; keep them hidden until then
       (also prevents a flash of the success message before the script loads) */
    .form-status:not([data-fs-active]) {
      display: none;
    }

    .field-error {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .field-error:not([data-fs-active]) {
      display: none;
    }

    .contact-form input[aria-invalid="true"],
    .contact-form textarea[aria-invalid="true"] {
      border-color: #1a1a1a;
    }

    /* --- Footer --- */
    footer {
      border-top: 1px solid #ddd;
      padding: 2rem 1.25rem;
    }

    footer .inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    footer .footer-info {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.7;
    }

    footer .footer-info .copy {
      display: block;
      margin-bottom: 0.4rem;
    }

    footer .footer-contact {
      font-style: normal;
    }

    footer .footer-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    footer .footer-links a,
    footer .footer-contact a {
      font-size: 0.85rem;
      color: #555;
      text-decoration: none;
    }

    footer .footer-links a:hover,
    footer .footer-contact a:hover {
      color: #1a1a1a;
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      header .top {
        flex-direction: column;
        gap: 0.25rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <h1>Jarilo</h1>
      <span class="tagline">Little apps, big experiences</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h2 class="page-title">Contact</h2>

    <div class="form-status" data-fs-success role="status">Thanks — your message has been sent. We’ll get back to you soon.</div>
    <div class="form-status" data-fs-error role="alert"></div>

    <form class="contact-form" action="https://formspree.io/f/mkoavwre" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" data-fs-field required />
          <span class="field-error" data-fs-error="name"></span>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" data-fs-field required />
          <span class="field-error" data-fs-error="email"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What's this about?" data-fs-field required />
        <span class="field-error" data-fs-error="subject"></span>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message…" data-fs-field required></textarea>
        <span class="field-error" data-fs-error="message"></span>
      </div>
      <!-- Honeypot: hidden from humans, catches spam bots -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />
      <button type="submit" class="submit-btn" data-fs-submit-btn>Send Message</button>
    </form>
  </main>

  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '.contact-form', formId: 'mkoavwre' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

  <footer>
    <div class="inner">
      <div class="footer-info">
        <span class="copy">&copy; 2025 Jarilo LLC</span>
        <address class="footer-contact">
          3750 N Kedzie Ave #18122<br />
          Chicago, IL 60618-9998<br />
          (708) 580-6457<br />
          <a href="mailto:contact@jarilo.io">contact@jarilo.io</a>
        </address>
      </div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="tos.html">Terms of Service</a>
      </div>
    </div>
  </footer>

</body>
</html>
