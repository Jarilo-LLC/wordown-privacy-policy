<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Jarilo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 2px solid #1a1a1a;
      padding: 2rem 1.25rem 0;
    }

    header .top {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header .tagline {
      font-size: 0.9rem;
      color: #555;
    }

    nav {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 0;
    }

    nav a {
      display: inline-block;
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #555;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }

    nav a:hover,
    nav a.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
      flex: 1;
      width: 100%;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
    }

    /* --- Footer --- */
    footer {
      border-top: 1px solid #ddd;
      padding: 2rem 1.25rem;
    }

    footer .inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    footer .footer-info {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.7;
    }

    footer .footer-info .copy {
      display: block;
      margin-bottom: 0.4rem;
    }

    footer .footer-contact {
      font-style: normal;
    }

    footer .footer-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    footer .footer-links a,
    footer .footer-contact a {
      font-size: 0.85rem;
      color: #555;
      text-decoration: none;
    }

    footer .footer-links a:hover,
    footer .footer-contact a:hover {
      color: #1a1a1a;
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      header .top {
        flex-direction: column;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <h1>Jarilo</h1>
      <span class="tagline">Little apps, big experiences</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html" class="active">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2 class="page-title">About</h2>
  </main>

  <footer>
    <div class="inner">
      <div class="footer-info">
        <span class="copy">&copy; 2025-2026 Jarilo LLC</span>
        <address class="footer-contact">
          3750 N Kedzie Ave #18122<br />
          Chicago, IL 60618-9998<br />
          (708) 580-6457<br />
          <a href="mailto:contact@jarilo.io">contact@jarilo.io</a>
        </address>
      </div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="tos.html">Terms of Service</a>
      </div>
    </div>
  </footer>

</body>
</html>
